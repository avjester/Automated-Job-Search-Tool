name: Weekly Newsfeed

on:
  schedule:
    - cron: '38 10 * * 1'  # Monday 3:38AM PDT (UTC-7)
  workflow_dispatch:        # lets you trigger it manually to test

permissions:
  contents: write

jobs:
  send-newsfeed:
    runs-on: ubuntu-latest
    # Search-heavy runs take a while, but a hung stream shouldn't ride the
    # 6-hour default.
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsfeed script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional: the real candidate profile (who they are, target roles,
          # home metro, watchlist). Kept as a secret so personal job-search
          # details never live in the repo; falls back to a generic example.
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
        run: python scripts/newsfeed.py

      # Only reached if the script above exited 0 (i.e. the report actually
      # sent) — a failed run should never mark roles as "seen," or a role the
      # candidate never actually received would silently disappear next week.
      # Commits only a small set of URL hashes and dates (see the dedup
      # section in scripts/newsfeed.py) — never plaintext company names,
      # titles, URLs, or report content, since this repo is public.
      - name: Commit dedup state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update seen-roles dedup state [skip ci]"
            git push
          fi
